<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WorkBuddy2API</title>
<style>
  :root{color-scheme:dark light;--bg:#0f1115;--fg:#e6e8ec;--dim:#8b93a1;--btn:#2f6fed;--btn2:#1b2029;--line:#252a33;--warn:#e0a33e;--ok:#3fb950}
  @media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--fg:#1a1d22;--dim:#6b7280;--btn2:#e9edf3;--line:#e3e6eb;--warn:#9a6b12;--ok:#1a7f37}}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--fg);
       font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       display:flex;align-items:center;justify-content:center;
       padding:calc(24px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
               calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
  .card{width:100%;max-width:440px}
  h1{margin:0 0 4px;font-size:17px;font-weight:600;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:12.5px;margin:0 0 16px}
  .box{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin:0 0 16px}
  .row{display:flex;align-items:baseline;gap:10px;padding:3px 0}
  .k{color:var(--dim);font-size:12px;flex:0 0 52px}
  .v{font-size:13px;word-break:break-all;flex:1}
  code{background:var(--btn2);padding:1px 5px;border-radius:5px;font-size:12.5px;word-break:break-all;font-family:ui-monospace,Menlo,monospace}
  a.b,button.b{display:block;width:100%;padding:13px 16px;margin:0 0 10px;border:0;border-radius:12px;
       font:inherit;font-weight:600;text-align:center;text-decoration:none;cursor:pointer}
  a.b{background:var(--btn);color:#fff}
  button.b{background:var(--btn2);color:var(--fg)}
  .tip{color:var(--dim);font-size:12px;margin:14px 0 0;line-height:1.75}
  .warn{color:var(--warn)}
  .ok{color:var(--ok)}
  .dim{color:var(--dim);font-size:12px}
  .sep{border-top:1px solid var(--line);margin:14px 0 12px}
  button.b:disabled{opacity:.55}
  .copied{color:var(--btn)}
</style>
</head>
<body>
<div class="card">
  <h1>WorkBuddy2API</h1>
  <p class="sub">OpenAI 兼容网关 · 手机本地运行</p>

  <div class="box">
    <div class="row"><span class="k">面板</span><span class="v"><code id="url">正在读取…</code></span></div>
    <div class="row"><span class="k">密钥</span><span class="v"><code id="key">—</code></span></div>
    <div class="row"><span class="k">状态</span><span class="v" id="state">—</span></div>
    <div class="row"><span class="k">进程</span><span class="v" id="pmsg">—</span></div>
    <div class="row"><span class="k">版本</span><span class="v"><code id="ver">—</code> <span class="dim" id="chk"></span></span></div>
    <div class="row"><span class="k">更新</span><span class="v" id="upd">检查中…</span></div>
  </div>

  <button class="b" id="copy" type="button">复制密钥</button>
  <a class="b" id="go" href="#">打开面板</a>
  <button class="b" id="br" type="button">用浏览器打开</button>
  <button class="b" id="rel" type="button">查看 Releases / 更新记录</button>

  <div class="sep"></div>
  <button class="b" id="restart" type="button">重启网关进程</button>
  <button class="b" id="stop" type="button">停止网关进程</button>

  <p class="tip" id="tip">&nbsp;</p>
</div>
<script>
(function () {
  // 端口与密钥从模块数据目录读（KernelSU / APatch 的 WebUI 都注入 ksu 全局对象）；
  // 没有这个对象就是 Magisk 原生环境，读不到 —— 那时只能靠命令行。
  function sh(cmd) {
    try {
      var k = (typeof ksu !== 'undefined' && ksu) ? ksu : (window.apatch || null);
      if (!k || typeof k.exec !== 'function') return null;
      var r = k.exec(cmd);
      if (r && typeof r === 'object') {
        var o = (r.stdout != null) ? r.stdout : ((r.result != null) ? r.result : null);
        return (o == null) ? null : String(o);
      }
      return (r == null) ? null : String(r);
    } catch (e) { return null; }
  }

  var PORT = 7863;
  var raw = sh('cat /data/adb/wb2a/port');
  var n = raw ? raw.replace(/[^0-9]/g, '').slice(0, 5) : '';
  if (n && +n >= 1024 && +n <= 65535) { PORT = +n; }

  // 面板在 /panel/（根路径 / 是 404，实测）
  var url = 'http://127.0.0.1:' + PORT + '/panel/';
  document.getElementById('url').textContent = url;
  document.getElementById('go').href = url;

  // 密钥：优先 apikey.txt（首启时落的一份），回退从 config.json 里抠
  var key = sh('cat /data/adb/wb2a/apikey.txt') || '';
  key = key.replace(/\s+/g, '');
  if (!key) {
    var cfg = sh("grep -o '\"api_key\"[^,]*' /data/adb/wb2a/config.json");
    if (cfg) {
      var m = cfg.match(/:\s*"([^"]+)"/);
      if (m) key = m[1];
    }
  }
  document.getElementById('key').textContent = key || '读取不到（用命令行 sh action.sh key）';

  // 状态：进程在不在（pgrep 匹配运行体完整路径）
  function refreshState() {
    var p = sh('pgrep -f /data/adb/wb2a/rt/bin/wb2api');
    var id = p ? String(p).replace(/[^0-9]/g, '') : '';
    document.getElementById('state').innerHTML = id
      ? '<span class="ok">运行中</span> <span class="dim">pid ' + id + '</span>'
      : '<span class="warn">未运行</span>';
    return id;
  }
  refreshState();

  document.getElementById('copy').addEventListener('click', function () {
    var btn = this;
    function ok() { btn.textContent = '已复制'; btn.className = 'b copied'; setTimeout(function () {
      btn.textContent = '复制密钥'; btn.className = 'b'; }, 1500); }
    if (key && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(key).then(ok, fallback);
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = key; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); ok(); } catch (e) { btn.textContent = '复制失败，手动选中上面的密钥'; }
      document.body.removeChild(ta);
    }
  });

  document.getElementById('br').addEventListener('click', function () {
    if (sh('am start -a android.intent.action.VIEW -d ' + url) === null) window.open(url, '_blank');
  });

  // ---------- 版本 / 上游更新 ----------
  // 仓库地址在打包时由 build_module.py 注入（CI 传 ${{ github.repository }}），
  // 源码里是占位符，改名只要改 CI，不用回来改 HTML。
  var REPO = '__WB2A_REPO__';
  var PAGES = 'https://__WB2A_PAGES__';
  // pre-release 与上游口径一致 ⇒ /releases/latest 可能是权威之外的东西，直接给列表：
  // 页面按发布时间倒序，第一行就是最新包。
  var REL = 'https://github.com/' + REPO + '/releases';
  // 与管理器读的是同一份 update.json：先试 Pages（国内直连通常通），
  // 再试 gh-proxy 镜像 raw，最后退回直连 raw（多半不通，留着兜底）。
  var UPD = [PAGES + '/update.json',
             'https://gh-proxy.com/https://raw.githubusercontent.com/' + REPO + '/main/update.json',
             'https://raw.githubusercontent.com/' + REPO + '/main/update.json'];

  var mp = sh("grep -m1 '^version=' /data/adb/modules/wb2a/module.prop") || '';
  var mver = mp.replace(/^\s*version=/, '').replace(/\s+/g, ' ').trim();
  var mcode = (sh("grep -m1 '^versionCode=' /data/adb/modules/wb2a/module.prop") || '').replace(/[^0-9]/g, '');
  var rtcode = (sh('cat /data/adb/wb2a/rt/.rtver') || '').replace(/[^0-9]/g, '');
  document.getElementById('ver').textContent = mver || '读取不到';

  var chk = document.getElementById('chk');
  if (mcode && rtcode && mcode !== rtcode) {
    chk.textContent = '· 运行体未同步（重启或点「执行」）';
  }

  // 更新检查：比 versionCode —— 和管理器里那个「有更新」是同一套判据
  var upd = document.getElementById('upd');
  var cur = mver.split(' ')[0] || '';
  function probe(i) {
    if (i >= UPD.length) {
      upd.innerHTML = '<span class="dim">网络不通</span> <span class="dim">— 点下面 Releases 自己看</span>';
      return;
    }
    var x = new XMLHttpRequest();
    x.open('GET', UPD[i] + (i === 0 ? '?t=' + Date.now() : ''), true);
    x.timeout = 8000;
    x.onload = function () {
      if (x.status !== 200) { probe(i + 1); return; }
      var j;
      try { j = JSON.parse(x.responseText); } catch (e) { probe(i + 1); return; }
      var rv = String(j.version || ''), rc = +j.versionCode || 0;
      if (!rc) { probe(i + 1); return; }
      if (!mcode) { upd.innerHTML = '<span class="dim">本机版本读不到，最新 ' + rv + '</span>'; return; }
      upd.innerHTML = rc > +mcode
        ? '<span class="warn">有新版 ' + rv + '</span> <span class="dim">（本机 ' + cur + '）→ 管理器里更新</span>'
        : '<span class="ok">已是最新</span> <span class="dim">' + rv + '</span>';
    };
    x.onerror = x.ontimeout = function () { probe(i + 1); };
    x.send();
  }
  probe(0);

  document.getElementById('rel').addEventListener('click', function () {
    if (sh('am start -a android.intent.action.VIEW -d ' + REL) === null) window.open(REL, '_blank');
  });

  // ---------- 进程控制 ----------
  // 直接调模块自己的 service.sh（stop/restart 都带着看门狗与更新定时器的清理），
  // 不在这里 pkill —— 那样看门狗会在 1 秒内把进程重新拉起来，看着像「停不掉」。
  var busy = false;
  var pmsg = document.getElementById('pmsg');
  function act(btn, doing, cmd, okWord, expectRunning) {
    if (busy) return;
    busy = true;
    var old = btn.textContent;
    btn.textContent = doing + '…';
    btn.disabled = true;
    pmsg.textContent = doing + '…';
    // ksu.exec 是同步的、会阻塞渲染：先让「正在…」画出来，再执行
    setTimeout(function () {
      var out = sh(cmd);
      btn.textContent = old;
      btn.disabled = false;
      busy = false;
      var id = refreshState();
      if (out === null) {
        pmsg.innerHTML = '<span class="warn">没有 shell 权限，只能命令行执行</span>';
      } else if (expectRunning && !id) {
        pmsg.innerHTML = '<span class="warn">命令跑完但进程没起来 —— 看 run.log</span>';
      } else if (!expectRunning && id) {
        pmsg.innerHTML = '<span class="warn">还活着 pid ' + id + '（可能被看门狗拉回）</span>';
      } else {
        pmsg.innerHTML = '<span class="ok">' + okWord + '</span>' +
          (id ? ' <span class="dim">pid ' + id + '</span>' : '');
      }
    }, 60);
  }

  document.getElementById('restart').addEventListener('click', function () {
    act(this, '重启中', 'sh /data/adb/modules/wb2a/service.sh restart', '已重启', true);
  });
  document.getElementById('stop').addEventListener('click', function () {
    if (!confirm('停止后网关不再对外提供服务，直到你点「重启网关进程」。继续？')) return;
    act(this, '停止中', 'sh /data/adb/modules/wb2a/service.sh stop', '已停止', false);
  });

  document.getElementById('tip').innerHTML =
    '面板首次打开要填上面的密钥（存在本机 localStorage）。<br>' +
    '同网段的电脑访问：<code>http://&lt;手机IP&gt;:' + PORT + '/panel/</code>，' +
    '改端口 <code>sh action.sh config</code>。<br>' +
    '升级＝管理器里刷 Releases 最新 zip（刷完即生效，不用重启）；自动更新 <code>sh action.sh auto on</code>。';
})();
</script>
</body>
</html>
