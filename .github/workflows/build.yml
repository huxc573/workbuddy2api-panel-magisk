name: build

# 上游一发新版 → 自动取运行体、打包、发 Release。
# 版本号：YY.MM.DD_x（北京时间当天第 x 个包），versionCode = YYMMDD*100+x。
on:
  workflow_dispatch:
    inputs:
      upstream:
        description: '上游 tag（留空＝自动取最新，例如 v2026.10.29.1418）'
        required: false
      force:
        description: '上游没变也强出一个新包'
        type: boolean
        default: false
  schedule:
    # 上游是「push 到 main 就可能出包」的时间戳 tag（2026.10.29.1418 这种）。
    # 实测最近 24 个包：一天 1~3 个、多数日子 1 个，相邻间隔中位 ~14.3h，最短 19min、最长 26h；
    # 且几乎全部落在北京时间 10:00~21:00。
    # 取每小时一次（cron 是 UTC，`30 *` 落到每分钟 30 分、即京时 X:30）：GitHub 的 schedule
    # 本身会漂移、高峰期还会丢触发，3 小时一次一旦漏掉就是整段空白；每小时一次最坏滞后 ~1h，
    # 空跑一次约 4s（skip 在前两步就退），一天 24 次也不到 2 分钟；公开仓库 Actions 不计费。
    - cron: '30 * * * *'

permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析上游版本
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: bash scripts/ci/upstream.sh "${{ inputs.upstream }}"

      - name: 算本次版本号
        id: ver
        if: steps.up.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Shanghai date +%y.%m.%d)
          used=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' 2>/dev/null || true)
          # 取「已有最大序号 + 1」，不是「第一个空位」：删过旧 Release 后空位会重号
          last=$(printf '%s\n' "$used" | sed -n "s|^v${today}_\([0-9]\{1,\}\)$|\1|p" | sort -n | tail -1)
          n=$(( ${last:-0} + 1 ))
          v="${today}_${n}"
          echo "本次版本: v$v（versionCode $((10#${today//./} * 100 + n))）"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: 取运行体
        if: steps.up.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/fetch-runtime.sh "${{ steps.up.outputs.tag }}"

      - name: 打包
        if: steps.up.outputs.skip != '1'
        env:
          UPSTREAM_TAG: ${{ steps.up.outputs.tag }}
          WB2A_SELF_REPO: ${{ github.repository }}
        run: python3 build_module.py "${{ steps.ver.outputs.version }}"

      - name: 发 Release
        if: steps.up.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
          UP: ${{ steps.up.outputs.tag }}
          UP_REPO: misakano7545/workbuddy2api-panel
        run: |
          set -euo pipefail
          zip="publish/WorkBuddy2API-Magisk-v${V}.zip"
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          du=$(du -h "$zip" | cut -f1)
          cat > notes.md <<EOF
          模块版本 **$V**，运行体取自上游 [${UP}](${GITHUB_SERVER_URL}/${UP_REPO}/releases/tag/${UP})（官方 linux-arm64 包，原样取出未改）。

          - 大小 $du，sha256 \`$sha\`
          - 安装：在管理器里刷入 zip（APatch / Magisk / KernelSU）；**首次安装要重启一次**，升级安装刷完即生效
          - 刷完在管理器里点「执行」看访问密钥；面板在 \`http://127.0.0.1:7863/panel/\`（安装时可改成 52017）

          上游项目：[${UP_REPO}](${GITHUB_SERVER_URL}/${UP_REPO})（MIT，见 THIRD-PARTY.md）
          EOF
          # Release 口径跟上游一致：上游 misakano7545/workbuddy2api-panel 发的是正式 Release，
          # 这边就 --latest（GitHub 自动标最新一个为 Latest），/releases/latest 才指得准。
          # 管理器更新只认 update.json 里的 versionCode，跟 Latest 无关 —— 但 README 里
          # 「直接 /releases/latest」那句得靠这个成立，所以别退回 --prerelease。
          gh release create "v$V" "$zip" --title "$V" --notes-file notes.md --latest

      - name: 写 update.json + 记账（UPSTREAM）
        if: steps.up.outputs.skip != '1'
        env:
          UP: ${{ steps.up.outputs.tag }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          zip="publish/WorkBuddy2API-Magisk-v${V}.zip"
          # version / versionCode 直接从打好的包里读：保证 update.json 与模块本体永远一致
          ver=$(unzip -p "$zip" module.prop | sed -n 's/^version=//p' | cut -d' ' -f1)
          vc=$(unzip -p "$zip" module.prop | sed -n 's/^versionCode=//p')
          # changelog 走 GitHub Pages：raw.githubusercontent 在国内基本连不上
          pages="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          cat > update.json <<EOF
          {
            "version": "$ver",
            "versionCode": $vc,
            "zipUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/v${V}/$(basename "$zip")",
            "changelog": "$pages/CHANGELOG.md"
          }
          EOF
          echo "$UP" > UPSTREAM
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UPSTREAM update.json
          # 上游没变时（force 出包）这一步可能没有 diff，跳过，别让 git commit 以 1 退出
          if git diff --cached --quiet; then
            echo "UPSTREAM / update.json 都没变，跳过提交"
            exit 0
          fi
          git commit -m "chore: 发布 v$V（上游 $UP）"
          git push

      - name: 没有新版
        if: steps.up.outputs.skip == '1'
        run: echo "上游仍是 ${{ steps.up.outputs.tag }}，跳过。要强制出包请勾 force。"
